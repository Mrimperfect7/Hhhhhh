<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charcoal Grills — Opening September 15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Alex+Brush&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --char-black:#1a1613;
    --char-brown:#241d18;
    --ember:#c4622a;
    --ember-bright:#e8823f;
    --bone:#ede4d3;
    --ash:#8a7f72;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;}

  body{
    background:var(--char-black);
    color:var(--bone);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
    padding:24px;
  }

  /* charcoal texture: subtle grain + smoke gradient */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(196,98,42,0.16), transparent 70%),
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(196,98,42,0.06), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    opacity:0.5;
    background-image:
      repeating-radial-gradient(circle at 15% 30%, rgba(255,255,255,0.015) 0, transparent 2px),
      repeating-radial-gradient(circle at 70% 65%, rgba(255,255,255,0.02) 0, transparent 1.5px);
    background-size: 3px 3px, 4px 4px;
    pointer-events:none;
    z-index:0;
  }

  .content{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--ember-bright);
    margin-bottom:28px;
    opacity:0;
    animation:rise 0.8s ease-out 0.1s forwards;
  }

  .logo-mark{
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    animation:rise 0.9s ease-out 0.25s forwards;
  }

  .logo-icon{
    width:clamp(56px, 12vw, 76px);
    height:clamp(56px, 12vw, 76px);
    border-radius:50%;
    background:#e8a13c;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:6px;
  }

  .logo-icon svg{
    width:52%;
    height:52%;
    fill:#000;
  }

  .logo-script{
    font-family:'Alex Brush', cursive;
    font-weight:400;
    font-size:clamp(4.2rem, 15vw, 8.4rem);
    line-height:0.8;
    color:#e0299e;
  }

  .logo-caps{
    margin-top:2px;
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:clamp(1.3rem, 4vw, 2rem);
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:#e0299e;
  }

  .tagline{
    margin-top:22px;
    font-size:16px;
    color:var(--ash);
    max-width:420px;
    line-height:1.6;
    opacity:0;
    animation:rise 0.9s ease-out 0.4s forwards;
  }

  /* signature: ember-lit divider that flickers like a live coal */
  .divider{
    margin:44px 0 40px;
    width:56px;
    height:2px;
    background:var(--ember);
    border-radius:2px;
    position:relative;
    opacity:0;
    animation:rise 0.9s ease-out 0.5s forwards;
    box-shadow:0 0 12px 1px rgba(232,130,63,0.7);
    animation:rise 0.9s ease-out 0.5s forwards, flicker 3.2s ease-in-out 1.4s infinite;
  }

  .countdown{
    display:flex;
    gap:clamp(14px, 4vw, 28px);
    opacity:0;
    animation:rise 0.9s ease-out 0.6s forwards;
  }

  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:64px;
  }

  .unit .num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(2rem, 6vw, 3.2rem);
    color:var(--bone);
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 22px rgba(232,130,63,0.25);
  }

  .unit .label{
    margin-top:6px;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--ash);
  }

  .colon{
    font-family:'Fraunces',serif;
    font-size:clamp(1.6rem, 5vw, 2.6rem);
    color:var(--ember);
    align-self:flex-start;
    margin-top:4px;
    opacity:0.6;
  }

  .date-line{
    margin-top:40px;
    font-size:14px;
    color:var(--ash);
    letter-spacing:0.02em;
    opacity:0;
    animation:rise 0.9s ease-out 0.75s forwards;
  }

  .date-line strong{
    color:var(--ember-bright);
    font-weight:600;
  }

  footer{
    position:relative;
    z-index:1;
    margin-top:56px;
    font-size:12px;
    color:var(--ash);
    letter-spacing:0.05em;
    opacity:0;
    animation:rise 0.9s ease-out 0.9s forwards;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  @keyframes flicker{
    0%, 100%{ opacity:1; box-shadow:0 0 12px 1px rgba(232,130,63,0.7);}
    45%{ opacity:0.85; box-shadow:0 0 8px 1px rgba(232,130,63,0.5);}
    55%{ opacity:1; box-shadow:0 0 16px 2px rgba(232,130,63,0.85);}
  }

  @media (prefers-reduced-motion: reduce){
    .eyebrow, .logo-mark, .tagline, .divider, .countdown, .date-line, footer{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
  }

  @media (max-width:420px){
    .countdown{gap:10px;}
    .unit{min-width:52px;}
  }
</style>
</head>
<body>

  <div class="content">
    <div class="eyebrow">Now Firing Up</div>
    <div class="logo-mark">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 2v7a1 1 0 0 0 1 1v12h1V10a1 1 0 0 0 1-1V2H8v6H7.5V2H7v6H6.5V2H6z"/>
          <path d="M16.5 2c-1.4 0-2.5 1.8-2.5 4s.9 3.7 2 4v10h1V10c1.1-.3 2-1.8 2-4s-1.1-4-2.5-4z"/>
        </svg>
      </div>
      <div class="logo-script">Charcoal</div>
      <div class="logo-caps">Grills</div>
    </div>
    <p class="tagline">Live-fire cooking, slow smoke, and a room built around the coals. Doors open soon.</p>

    <div class="divider"></div>

    <div class="countdown" id="countdown">
      <div class="unit"><span class="num" id="days">00</span><span class="label">Days</span></div>
      <span class="colon">:</span>
      <div class="unit"><span class="num" id="hours">00</span><span class="label">Hrs</span></div>
      <span class="colon">:</span>
      <div class="unit"><span class="num" id="minutes">00</span><span class="label">Min</span></div>
      <span class="colon">:</span>
      <div class="unit"><span class="num" id="seconds">00</span><span class="label">Sec</span></div>
    </div>

    <p class="date-line">Opening <strong>September 15</strong></p>
  </div>

  <footer>Charcoal Grills</footer>

<script>
  const target = new Date("September 15, 2026 00:00:00").getTime();

  function pad(n){ return String(n).padStart(2,'0'); }

  function update(){
    const now = new Date().getTime();
    let diff = target - now;

    if(diff <= 0){
      document.getElementById('countdown').innerHTML = '<div class="unit"><span class="num">We\'re open</span></div>';
      return;
    }

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const minutes = Math.floor((diff / (1000*60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById('days').textContent = pad(days);
    document.getElementById('hours').textContent = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
